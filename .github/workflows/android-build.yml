name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install dependencies
      run: npm ci || npm install
    
    - name: Build web app
      run: npm run build
    
    - name: Copy web assets to android
      run: npx cap copy android
    
    - name: Update android plugins
      run: npx cap update android
    
    - name: Make gradlew executable
      run: chmod +x android/gradlew
    
    - name: Build Debug APK
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Create Release with APK
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.1.${{ github.run_number }}
        name: DailyLog v1.1.${{ github.run_number }}
        body: |
          ## 📱 DailyLog APK
          
          아래 `app-debug.apk` 파일을 다운로드하여 설치하세요.
          
          ### 설치 방법
          1. 휴대폰에서 기존 DailyLog 앱 삭제
          2. APK 파일 다운로드
          3. 설정 → 보안 → 출처를 알 수 없는 앱 설치 허용
          4. APK 파일 실행하여 설치
        files: android/app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
